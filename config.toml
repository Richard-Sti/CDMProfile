# Main configuration file (git tracked)
# Machine-specific paths are loaded from local_config.toml (not git tracked)

[fitting]
# Run name for equations (e.g., ext_maths, ext_maths_DM)
runname = "ext_maths_DM"

# Path to halo data (folder of .npy files or HDF5 file)
# Use {snap:03d} as placeholder for the snapshot number (set via --snap)
# Can be overridden entirely with --halos command line argument
halos = "tng_particles/particles_{snap:03d}.hdf5"

# Binning
nbin = 100
n_sample = 0  # Downsample halos to this many particles (0 = no downsampling)

# MPI work distribution
batch_size = 15

# How often to write results to disk (every N functions)
write_buffer_size = 10

# Save results to text files (ranking + failed functions by category)
save_text_results = true

# Optimizer settings
optimizer = "neldermead"  # Options: "sbplx", "neldermead", "bobyqa"
maxeval = 5_000
xtol = 1e-6
ftol = 1e-6

# Simpson integration for mass normalization
simpson_n = 512  # Number of intervals (must be even). Higher = more accurate but slower

# Multi-restart settings (lists indexed by number of free parameters: 1, 2, 3, ...)
# Functions with more free params than list length use the last value
max_restarts = [500, 2000, 4000]
nconv_required = [10, 10, 10]
conv_rtol = 1e-3
conv_atol = 10

# Early stopping: skip remaining halos if first N all fail
early_stop_failures = 50

# Minimum fraction of halos that must be successfully fit
# Functions with fewer successful fits are discarded from ranking
min_halo_success_fraction = 0.5

# Percentile for imputing loss to failed halos (0-100)
# Failed halos are assigned this percentile of the loss/npart distribution
# from successful fits. Set to 0 to disable imputation.
failure_loss_percentile = 95

# NFW comparison early stopping: skip function if avg loss/npart after first N halos
# is worse than NFW's avg + factor (absolute threshold).
# Multiple tiers: checked in order, earlier tiers catch clearly bad functions faster
nfw_early_stop_enabled = true
nfw_early_stop_halos = [100, 200]       # Check after this many halos
nfw_early_stop_factors = [2, 1]        # Stop if avg > NFW_avg + factor
nfw_early_stop_same_halos = true  # Compare against NFW avg for same N halos (true) or all halos (false)

# Parameter bounds for fitting
# Rs bounds are relative to halo rmin/rmax
Rs_lower_factor = 0.25      # Rs_min = rmin * Rs_lower_factor
Rs_upper_factor = 10.0      # Rs_max = rmax * Rs_upper_factor
# a0-a3 bounds (absolute)
a_lower = -10.0
a_upper = 10.0

[asymptotes]
# Post-fit asymptote validation for parameter-dependent functions
# Run via: mpirun -n 4 python check_asymptotes.py --results <file> --complexity <n>

# Number of top-ranked functions to validate (0 = all)
top_n = 100

# Number of halos to sample for validation (0 = all)
n_halos = 20

# Pass rate thresholds
inf_threshold = 0.5   # lim(x->inf) must be ~0
zero_threshold = 0.5  # lim(x->0+) must be > 0

# Computation settings
round_decimals = 4
timeout = 0  # seconds, 0 = no timeout
verbose = false

# MPI batch size
batch_size = 10
